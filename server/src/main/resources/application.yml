server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: jizhangbao-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:jizhangbao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:603605}
    hikari:
      minimum-idle: 4
      maximum-pool-size: 16
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: JiZhangBaoHikariPool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: true
  ai:
    model:
      # dev/demo 默认关闭真实大模型，走本地规则引擎（零依赖可跑通）
      chat: none
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-not-used-in-rule-mode}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.3

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jizhangbao.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

jizhangbao:
  jwt:
    secret: ${JWT_SECRET:jizhangbao-super-secret-key-please-change-in-production-2025}
    expire-hours: 168
    header: Authorization
    prefix: "Bearer "
  ai:
    # rule: 本地规则引擎（离线可用）  llm: Spring AI 调用大模型
    mode: ${AI_MODE:rule}
    model: ${OPENAI_MODEL:deepseek-chat}
    provider: ${AI_PROVIDER:deepseek}
    timeout-seconds: 60
    max-history-messages: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  demo:
    # 首次启动时写入演示账号与演示账单数据
    enabled: ${DEMO_DATA_ENABLED:true}
    username: demo
    password: "123456"
    admin-username: admin
    admin-password: "123456"
    bill-days: 200
  report:
    # 每月 1 日 02:00 自动为上个月生成消费分析报告
    cron: "0 0 2 1 * ?"
    enabled: true

logging:
  level:
    root: INFO
    com.jizhangbao: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

app:
  version: 1.0.0
